<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2faf8c">
  <title>Controle de saídas — CEEMTI Baixo Guandu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <h1>Controle de saídas</h1>
      <div class="bar-right">
        <a class="mode" href="/secretaria">Secretaria</a>
        <img class="logo" src="/static/logo-ceemti.png" alt="CEEMTI Baixo Guandu">
      </div>
    </div>
  </header>
  <section class="teacher-section">
    <div class="inner teacher-layout">
      <div class="panel">
        <h2>Painel do professor</h2>
        <form id="formLogin" class="form-row">
          <label for="pin">PIN do professor</label>
          <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
          <button class="button primary" type="submit">Entrar</button>
        </form>
        <p id="erroLogin" class="error" role="alert" hidden></p>

        <div id="acoesProfessor" hidden>
          <div class="teacher-heading">
            <p class="success">Acesso do professor liberado.</p>
            <a class="button primary" href="/registros">Ver registros de eventos</a>
            <button id="sairProfessor" class="button secondary" type="button">Sair</button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <main>
    <section class="intro">
      <div class="inner">
        <div class="intro-heading">
          <div>
            <h2>Controle da sala</h2>
            <p>Toque no botão de um aluno para registrar a saída ou o retorno. O limite é de 3 minutos.</p>
          </div>
          <span id="modo" class="mode">Conectando…</span>
        </div>
        <p id="aviso" class="notice" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="controlesDemo" class="demo-section" hidden>
      <div class="inner demo-controls">
        <button id="reiniciar" class="button danger" type="button">Reiniciar simulação</button>
      </div>
    </section>

    <section class="students-section">
      <div class="inner">
        <div class="section-heading">
          <h2 id="turmaTitulo">Turmas</h2>
          <div class="turma-picker">
            <label for="turma">Turma:</label>
            <select id="turma" aria-label="Turma"></select>
          </div>
          <span id="atualizado" class="muted"></span>
        </div>
        <div id="listaAlunos" class="student-list" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="/static/index.js"></script>
</body>
</html>
