<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2faf8c">
  <title>Secretaria — CEEMTI Baixo Guandu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <h1>Secretaria</h1>
      <div class="bar-right">
        <a class="mode" href="/registros">Registros</a>
        <img class="logo" src="/static/logo-ceemti.png" alt="CEEMTI Baixo Guandu">
      </div>
    </div>
  </header>

  <main class="records-main">
    <section class="inner records-section">
      <a class="button secondary" href="/">Voltar ao controle das turmas</a>

      <div class="panel records-panel">
        <div class="records-heading">
          <div>
            <h2>Alunos problema</h2>
            <p class="muted">Atualizado automaticamente.</p>
          </div>
        </div>
        <form id="formSecretaria" class="form-row secretary-password-row">
          <label for="senhaSecretaria">Senha da secretaria:</label>
          <input id="senhaSecretaria" type="password" autocomplete="current-password" required>
          <button class="button primary" type="submit">Consultar alunos</button>
        </form>
        <div id="listaProblema" class="student-list" aria-live="polite"></div>
        <p id="semProblema" class="empty" hidden>Nenhum aluno problema no momento.</p>
        <p id="avisoSecretaria" class="error" role="alert" hidden></p>
      </div>
    </section>
  </main>

  <footer id="footer" class="bar">
    <div class="bar-inner">
      <h2 class="footer-title">CEEMTI Baixo Guandu</h2>
      <nav class="footer-links" aria-label="Links do rodapé">
        <a class="mode" href="https://www.instagram.com/ceemti.control?cnvx=NnR1azRlN2toeTd4">@CEEMTI.control</a>
      </nav>
    </div>
  </footer>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      let senhaAtiva = "";

      function elemento(tag, classe, texto) {
        const node = document.createElement(tag);
        if (classe) node.className = classe;
        if (texto !== undefined) node.textContent = texto;
        return node;
      }

      function desenhar(alunos) {
        const lista = $("listaProblema");
        lista.replaceChildren();
        $("semProblema").hidden = alunos.length > 0;
        alunos.forEach((aluno) => {
          const item = elemento("article", "student-card is-problem");
          const info = elemento("div", "student-info");
          info.append(elemento("h3", "student-name", aluno.nome));
          info.append(elemento("span", "student-id", aluno.turma));
          const status = elemento("div", "student-status");
          status.append(elemento("span", "status-label problem", "Aluno problema!"));
          const acoes = elemento("div", "student-actions");
          const zerar = elemento("button", "button secondary", "Zerar atrasos");
          zerar.type = "button";
          zerar.disabled = !$("senhaSecretaria").value.trim();
          zerar.addEventListener("click", () => zerarAtrasos(aluno.id));
          acoes.append(zerar);
          item.append(info, status, acoes);
          lista.append(item);
        });
      }

      async function zerarAtrasos(alunoId) {
        if (!senhaAtiva) return;
        $("avisoSecretaria").hidden = true;
        try {
          const resposta = await fetch(`/api/secretaria/zerar/${alunoId}`, {
            method: "POST",
            headers: { "X-SENHA": senhaAtiva },
          });
          if (!resposta.ok) {
            const dados = await resposta.json().catch(() => ({}));
            const erro = new Error(typeof dados.detalhe === "string" ? dados.detalhe : "Não foi possível zerar os atrasos.");
            erro.status = resposta.status;
            throw erro;
          }
          await atualizar();
        } catch (erro) {
          if (erro.status === 401 || erro.status === 429) {
            senhaAtiva = "";
            $("listaProblema").replaceChildren();
            $("semProblema").hidden = true;
          }
          $("avisoSecretaria").textContent = erro.message;
          $("avisoSecretaria").hidden = false;
        }
      }

      async function atualizar() {
        if (!senhaAtiva) return;
        const senha = senhaAtiva;
        try {
          const resposta = await fetch("/api/secretaria/problema", {
            headers: { "X-SENHA": senha },
          });
          const dados = await resposta.json();
          if (!resposta.ok) {
            const erro = new Error(typeof dados.detalhe === "string" ? dados.detalhe : "Não foi possível carregar a lista.");
            erro.status = resposta.status;
            throw erro;
          }
          if (senha !== senhaAtiva) return;
          desenhar(dados.alunos);
          $("avisoSecretaria").hidden = true;
        } catch (erro) {
          if (senha !== senhaAtiva) return;
          if (erro.status === 401 || erro.status === 429) {
            senhaAtiva = "";
            $("listaProblema").replaceChildren();
            $("semProblema").hidden = true;
          }
          $("avisoSecretaria").textContent = erro.message;
          $("avisoSecretaria").hidden = false;
        }
      }

      $("formSecretaria").addEventListener("submit", (evento) => {
        evento.preventDefault();
        senhaAtiva = $("senhaSecretaria").value;
        atualizar();
      });

      $("senhaSecretaria").addEventListener("input", () => {
        if ($("senhaSecretaria").value !== senhaAtiva) {
          senhaAtiva = "";
          $("listaProblema").replaceChildren();
          $("semProblema").hidden = true;
          $("avisoSecretaria").hidden = true;
        }
      });

      window.setInterval(() => {
        if (senhaAtiva) atualizar();
      }, 2000);
    })();
  </script>
</body>
</html>
