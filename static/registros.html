<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2faf8c">
  <title>Registros de eventos — CEEMTI Baixo Guandu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <h1>Registros de eventos</h1>
      <img class="logo" src="/static/logo-ceemti.png" alt="CEEMTI Baixo Guandu">
    </div>
  </header>

  <main class="records-main">
    <section class="inner records-section">
      <a class="button secondary" href="/">Voltar ao controle das turmas</a>

      <div id="loginRegistros" class="panel records-panel" hidden>
        <h2>Área do professor</h2>
        <p>Digite o PIN do professor para ver os registros.</p>
        <form id="formLoginRegistros" class="form-row">
          <label for="pinRegistros">PIN do professor</label>
          <input id="pinRegistros" type="password" inputmode="numeric" autocomplete="current-password" required>
          <button class="button primary" type="submit">Entrar</button>
        </form>
        <p id="erroRegistros" class="error" role="alert" hidden></p>
      </div>

      <div id="painelRegistros" class="panel records-panel" hidden>
        <div class="records-heading">
          <div>
            <h2>Eventos recentes</h2>
            <p class="muted">Atualizado automaticamente.</p>
          </div>
          <button id="sairRegistros" class="button secondary" type="button">Sair do painel</button>
        </div>
        <ul id="eventos" class="event-list"></ul>
        <p id="semEventos" class="muted" hidden>Nenhum evento registrado nesta sessão.</p>
        <p id="avisoRegistros" class="error" role="alert" hidden></p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      let pin = sessionStorage.getItem("pinProfessor") || "";

      async function chamarApi(url, metodo = "GET", pinAtual = pin) {
        const resposta = await fetch(url, {
          method: metodo,
          headers: { "X-PIN": pinAtual },
        });
        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok) {
          throw new Error(typeof dados.detail === "string" ? dados.detail : "Não foi possível carregar os registros.");
        }
        return dados;
      }

      function mostrarLogin(mensagem = "") {
        $("painelRegistros").hidden = true;
        $("loginRegistros").hidden = false;
        $("erroRegistros").textContent = mensagem;
        $("erroRegistros").hidden = !mensagem;
      }

      function mostrarEventos(eventos) {
        const lista = $("eventos");
        lista.replaceChildren();
        $("semEventos").hidden = eventos.length > 0;
        eventos.forEach((evento) => {
          const item = document.createElement("li");
          item.className = evento.cls || "";
          const hora = document.createElement("time");
          hora.textContent = evento.hora;
          item.append(hora, document.createTextNode(` ${evento.texto}`));
          lista.append(item);
        });
        $("painelRegistros").hidden = false;
        $("loginRegistros").hidden = true;
        $("avisoRegistros").hidden = true;
      }

      async function atualizar() {
        try {
          const dados = await chamarApi("/api/professor/eventos");
          mostrarEventos(dados.eventos);
        } catch (erro) {
          if (erro.message === "PIN do professor incorreto.") {
            pin = "";
            sessionStorage.removeItem("pinProfessor");
            mostrarLogin("PIN inválido. Digite novamente.");
          } else {
            $("avisoRegistros").textContent = erro.message;
            $("avisoRegistros").hidden = false;
          }
        }
      }

      $("formLoginRegistros").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const pinDigitado = $("pinRegistros").value;
        try {
          await chamarApi("/api/professor/validar", "POST", pinDigitado);
          pin = pinDigitado;
          sessionStorage.setItem("pinProfessor", pin);
          await atualizar();
        } catch (erro) {
          mostrarLogin(erro.message);
        }
      });

      $("sairRegistros").addEventListener("click", () => {
        pin = "";
        sessionStorage.removeItem("pinProfessor");
        window.location.href = "/";
      });

      if (pin) atualizar();
      else mostrarLogin();
      window.setInterval(() => {
        if (pin) atualizar();
      }, 2000);
    })();
  </script>
</body>
</html>
