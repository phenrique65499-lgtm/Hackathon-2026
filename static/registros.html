<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2faf8c">
  <title>Registros de eventos — CEEMTI Baixo Guandu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <h1>Registros de eventos</h1>
      <div class="bar-right">
        <a class="mode" href="/secretaria">Secretaria</a>
        <img class="logo" src="/static/logo-ceemti.png" alt="CEEMTI Baixo Guandu">
      </div>
    </div>
  </header>

  <main class="records-main">
    <section class="inner records-section">
      <a class="button secondary" href="/">Voltar ao controle das turmas</a>

      <div id="loginRegistros" class="panel records-panel" hidden>
        <h2>Área do professor</h2>
        <p>Digite o PIN do professor para ver os registros.</p>
        <form id="formLoginRegistros" class="form-row">
          <label for="pinRegistros">PIN do professor</label>
          <input id="pinRegistros" type="password" inputmode="numeric" autocomplete="current-password" required>
          <button class="button primary" type="submit">Entrar</button>
        </form>
        <p id="erroRegistros" class="error" role="alert" hidden></p>
      </div>

      <div id="painelRegistros" class="panel records-panel" hidden>
        <div class="records-heading">
          <div>
            <h2>Eventos recentes</h2>
            <p class="muted">Atualizado automaticamente.</p>
          </div>
          <button id="sairRegistros" class="button secondary" type="button">Sair do painel</button>
        </div>
        <ul id="eventos" class="event-list"></ul>
        <p id="semEventos" class="muted" hidden>Nenhum evento registrado nesta sessão.</p>
        <p id="avisoRegistros" class="error" role="alert" hidden></p>
      </div>
    </section>
  </main>

  <footer id="footer" class="bar">
    <div class="bar-inner">
      <h2 class="footer-title">CEEMTI Baixo Guandu</h2>
      <nav class="footer-links" aria-label="Links do rodapé">
        <a class="mode" href="https://www.instagram.com/ceemti.control?cnvx=NnR1azRlN2toeTd4">@CEEMTI.control</a>
      </nav>
    </div>
  </footer>

  <script src="/static/registros.js"></script>
</body>
</html>
